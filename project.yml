name: SpoonFit
options:
  bundleIdPrefix: dev.ividi
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
targets:
  SpoonFit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpoonFit
    info:
      path: SpoonFit/Info.plist
      properties:
        CFBundleDisplayName: SpoonFit
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Automatic
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ividi.spoonfit
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  SpoonFitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpoonFitTests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SpoonFit
schemes:
  SpoonFit:
    build:
      targets:
        SpoonFit: all
        SpoonFitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpoonFitTests
    archive:
      config: Release
